[package]
name = "unity-crop"
version = "3.0.0"
edition = "2021"
rust-version = "1.85"
description = "Export sliced Unity sprite sheets using their .meta files"
license = "MIT"
repository = "https://github.com/Senya01/UnityCrop"
readme = "README.md"
keywords = ["unity", "sprites", "spritesheet", "crop"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
clap = { version = "=4.5.27", features = ["derive"] }
globset = "=0.4.15"
image = { version = "=0.25.5", default-features = false, features = ["png"] }
rayon = "=1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "=0.9.34"
walkdir = "=2.5.0"
